[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puppetnet"
version = "1.5.0"
description = "Serverless OSINT harvesting + NLP graph-ingestion engine for PuppetNET"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PuppetNET maintainers" }]
keywords = ["osint", "nlp", "spacy", "neo4j", "graph", "serverless", "ingestion"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "requests>=2.31,<3",
    "urllib3>=2.0,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.1,<7",
    "pypdf>=4.0,<7",
    "feedparser>=6.0,<7",
    "python-dateutil>=2.9,<3",
    "spacy>=3.7.5,<4.0",
    "neo4j>=5.13,<7",
    "PyYAML>=6.0,<7",
    "brotli>=1.1; platform_python_implementation=='CPython'",
]

[project.optional-dependencies]
# en_core_web_trf (transformer-backed NER + parser). Heavy: pulls torch.
trf = [
    "torch>=2.1",
    "transformers>=4.36,<5",
    "spacy-transformers>=1.3.4",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.1,<7",
    "ruff>=0.4",
]

[project.scripts]
puppetnet-ingest = "ingest:main"

[project.urls]
Homepage = "https://github.com/AndrexTheDev/PuppetNET"
Issues = "https://github.com/AndrexTheDev/PuppetNET/issues"

[tool.setuptools]
py-modules = ["ingest"]

[tool.setuptools.packages.find]
include = ["puppetnet*"]
exclude = ["tests*", "docs*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:feedparser.*",
    "ignore::DeprecationWarning:setuptools.*",
]
markers = [
    "integration: tests that touch Neo4j or the network (deselected by default in CI)",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [".venv", "reports", ".state"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]
ignore = [
    "E501",   # long lines are dominated by regex/keyword tables
    "B008",   # function calls in argument defaults (dataclass factories)
    "SIM103", # guard-clause chains read better than a folded boolean return
    "SIM905", # gazetteer tables are wrapped string literals on purpose
    "SIM108", # ternaries would hurt readability in the rule tables
    "RET504", # explicit locals before return aid debugging
]

[tool.ruff.lint.per-file-ignores]
# P/O/L/C are the entity-type shorthand used by the relation rule tables; E741
# flags the `O` alias, which is unambiguous in that context.
"tests/*" = ["B011", "SIM", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["puppetnet", "tests"]
