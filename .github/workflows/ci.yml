# =============================================================================
#  PuppetNET — continuous integration
# =============================================================================
#  Guards every deliverable on each push and pull request:
#    * worker.js   — syntax-checked with node --check, its graph API and host
#                    profiles exercised against a stubbed Neo4j
#    * ingest.py   — imported, CLI smoke-tested (--version, --list-sources,
#                    --print-config, --doctor) and exercised by pytest
#    * the package — unit tests that never need a spaCy model, a Neo4j
#                    instance, or network access (see tests/conftest.py)
#    * web/        — the analyst console: shipped JavaScript syntax-checked, the
#                    committed Tailwind build proven up to date, and the whole
#                    SPA booted inside jsdom against the vendored graph engine
#
#  Nothing here touches the network beyond npm/PyPI: both smoke suites stub
#  every upstream, so CI cannot pass because a third-party API was reachable.
# =============================================================================

name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install pytest>=8.0 ruff>=0.4

      - name: Ruff (lint)
        run: ruff check puppetnet ingest.py tests

      - name: Byte-compile everything
        run: python -m compileall -q puppetnet ingest.py tests

      - name: CLI smoke tests
        env:
          DRY_RUN: "true"
          LOG_LEVEL: "ERROR"
        run: |
          python ingest.py --version
          python ingest.py --list-sources | head -c 400
          python ingest.py --print-config | head -c 400
          # --doctor must never hard-fail on a missing model or missing secrets.
          python ingest.py --doctor || echo "doctor reported a degraded mode (expected without secrets)"

      - name: Pytest
        env:
          DRY_RUN: "true"
          LOG_LEVEL: "ERROR"
        run: pytest -q -m "not integration"

  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check worker.js
        run: node --check worker.js

      # Runs the exported fetch handler against a stubbed upstream: proves the
      # host profiles relay WDQS SPARQL as a polite form POST, cap the caller's
      # rate, inject OpenCorporates/RapidAPI credentials at the edge and never
      # echo a secret back to the harvester. No network, no wrangler, no bindings.
      - name: Behavioural smoke test (host profiles)
        run: node tests/worker_smoke.mjs

      - name: Validate wrangler.toml
        run: |
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("wrangler.toml", "utf8");
            const required = ["name", "main", "compatibility_date"];
            const missing = required.filter((key) => !new RegExp(`^\\\\s*${key}\\\\s*=`, "m").test(text));
            if (missing.length) {
              console.error("wrangler.toml is missing:", missing.join(", "));
              process.exit(1);
            }
            console.log("wrangler.toml declares:", required.join(", "));
          '

      - name: Dry-run wrangler config (if the CLI is reachable)
        continue-on-error: true
        run: npx --yes wrangler@latest deploy --dry-run --outdir /tmp/wrangler-out

  web:
    name: Web console
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Dev tooling only (Tailwind CLI, jsdom, terser). The console itself ships
      # no runtime dependency: everything it loads lives in web/vendor/.
      - name: Install build and test tooling
        run: npm ci

      - name: Syntax check the shipped JavaScript
        run: |
          node --check web/app.js
          node --check worker.js

      # The console is self-hostable, so the CSS it ships must be the CSS its
      # sources produce. A stale commit means the deployed page silently loses
      # whatever class was added last.
      - name: Committed Tailwind build is up to date
        run: |
          npm run build:css
          git diff --exit-code web/vendor/tailwind.css

      - name: Vendored libraries and licences are committed
        run: |
          for file in cytoscape.min.js cytoscape-fcose.min.js layout-base.min.js \
                      cose-base.min.js tailwind.css README.md; do
            test -s "web/vendor/$file" || { echo "missing web/vendor/$file"; exit 1; }
          done
          for lib in cytoscape cytoscape-fcose layout-base cose-base; do
            test -s "web/vendor/LICENSE.$lib" || { echo "missing licence for $lib"; exit 1; }
          done
          echo "vendored assets present with licences"

      # Boots index.html + app.js + the vendored engine inside jsdom and drives
      # the real UI: search, canvas, filters, N-hop expansion, handshake
      # pathfinding, the data table, CSV export, keyboard shortcuts, deep links,
      # worker mode against the actual worker.js, and the offline fallback.
      - name: Console smoke test (headless browser)
        run: node tests/web_smoke.mjs

      - name: Graph API smoke test
        run: node tests/worker_smoke.mjs
