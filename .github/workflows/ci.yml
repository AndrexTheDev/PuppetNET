name: CI 2.0
on:
  push:
    branches: [main, arena/322dea42-puppetnet]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
# Same mutex as ingestion, so maintenance/ingest/CI never overlap.
concurrency:
  group: puppetnet-free-tier
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Conservative monthly free-minute admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-budget.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/pipeline/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run test:scaffold && npm test && npm run build
      - run: npm run deploy -w @puppetnet/worker -- --dry-run --outdir /tmp/worker-dry-run
      - run: npm audit --audit-level=high
      - run: pip install -e './packages/pipeline[dev]'
      - run: python -m pytest -q -m 'not integration'
      - run: ruff check packages/pipeline
