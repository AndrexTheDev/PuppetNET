name: Python ingestion pipeline
on:
  push:
    branches: [main]
    paths:
      - 'packages/pipeline/**'
      - 'tests/**.py'
      - '.github/workflows/ingestion-pipeline.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/pipeline/**'
      - 'tests/**.py'
      - '.github/workflows/ingestion-pipeline.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      run_ingestion:
        description: 'Run GLiNER and persist to Neo4j (requires repository opt-in and secrets)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: puppetnet-python-ingestion
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/pipeline/pyproject.toml
      - run: pip install -e './packages/pipeline[dev]'
      - run: python -m pytest -q -m 'not integration'
      # Lint every test module, not a hand-maintained list: new suites
      # (entity resolution, puppet master, keep-alive) must not escape CI.
      - run: ruff check packages/pipeline tests
      - name: Offline multilingual NLP contract
        run: |
          python - <<'PYCODE'
          from nlp.chunking import chunk_text, split_sentences
          from nlp.labels import OSINT_LABELS
          from nlp.triplet_extractor import DEFAULT_PREDICATES, NeuronBudget

          sample = (
              "Dr. Anna Müller von der Acme GmbH traf sich in Berlin. "
              "Иван Петров работает в Москве. "
              "التقى محمد علي بشركة النور في دبي."
          )
          sentences = split_sentences(sample)
          chunks = chunk_text(sample, max_tokens=384, overlap_tokens=64)
          assert len(sentences) >= 3 and chunks
          assert all(chunk.token_count <= 384 for chunk in chunks)
          assert len(OSINT_LABELS) == 9
          budget = NeuronBudget(None, daily_limit=10_000, input_rate=4_119, output_rate=34_868)
          per_chunk = budget.estimate(384, 250)
          print(f'OSINT labels: {len(OSINT_LABELS)}; predicates: {len(DEFAULT_PREDICATES)}')
          print(f'Chunks for multilingual sample: {len(chunks)}')
          print(f'Approx. free-tier chunks/day (fp8-fast, 384+250 tokens): {int(10_000 / per_chunk)}')
          PYCODE
  ingestion:
    needs: tests
    # Never ingest from PRs or arbitrary branches; missing secrets must fail,
    # not silently simulate a successful production write.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_INGESTION == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_ingestion))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NLP_BACKEND: gliner
      GLINER_MODEL: urchade/gliner_multi-v2.1
      GLINER_THRESHOLD: '0.5'
      GLINER_RUNTIME: torch
      GLINER_CONTEXT_TOKENS: '384'
      GLINER_OVERLAP_TOKENS: '64'
      TRIPLET_BACKEND: ${{ vars.TRIPLET_BACKEND || 'off' }}
      CF_AI_MODEL: ${{ vars.CF_AI_MODEL || '@cf/meta/llama-3.1-8b-instruct-fp8-fast' }}
      CF_AI_DAILY_NEURONS: '10000'
      CF_AI_BUDGET_FILE: .state/cloudflare_ai_budget.json
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NLP_MAX_CHARS_PER_DOC: '20000'
      NLP_MAX_SENTENCES_PER_DOC: '100'
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      PROXY_WORKER_URL: ${{ secrets.PROXY_WORKER_URL }}
      PROXY_AUTH_TOKEN: ${{ secrets.PROXY_AUTH_TOKEN }}
      DRY_RUN: 'false'
      ENABLED_SOURCES: wikidata,news_world
      MAX_DOCUMENTS_TOTAL: '100'
      MAX_DOCUMENTS_PER_SOURCE: '25'
      MAX_RUNTIME_SECONDS: '1200'
      ANALYTICS_ENABLED: 'false'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Require actual database credentials
        shell: bash
        run: |
          test -n "$NEO4J_URI" || { echo 'Missing NEO4J_URI'; exit 1; }
          test -n "$NEO4J_USERNAME" || { echo 'Missing NEO4J_USERNAME'; exit 1; }
          test -n "$NEO4J_PASSWORD" || { echo 'Missing NEO4J_PASSWORD'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/pipeline/pyproject.toml
      - name: Install CPU-only GLiNER pipeline (no GPU or inference API)
        run: |
          pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          pip install -e './packages/pipeline[gliner]'

      - name: Free-tier guard (180,000-node stop)
        shell: bash
        run: |
          code=0
          python graph_analytics.py --guard --json || code=$?
          if [ "$code" -eq 4 ]; then
            echo '::warning::AuraDB Free stop engaged (>= 180,000 nodes); new entity nodes will be refused'
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: gliner-multi-v2.1-cpu-v1
      - name: Preflight actual model before fetching or writing data
        run: |
          python - <<'PYCODE'
          from puppetnet.config import load_settings
          from puppetnet.parsing.gliner_engine import GLiNEREngine
          engine = GLiNEREngine(load_settings())
          result = engine.parse_text('Alice works at Example Holdings in London.')
          print(engine.describe())
          print('Model preflight entities:', len(result.entities))
          engine.close()
          PYCODE
      - name: Restore Workers AI neuron ledger
        if: vars.TRIPLET_BACKEND == 'cloudflare'
        uses: actions/cache/restore@v4
        with:
          path: .state/cloudflare_ai_budget.json
          key: cf-ai-budget-${{ github.run_id }}
          restore-keys: cf-ai-budget-

      - name: Multilingual entity extraction preflight (gliner_multi-v2.1)
        run: |
          python - <<'PYCODE'
          from nlp.extractor import GLiNERExtractor

          samples = {
              'de': 'Dr. Anna Müller von der Acme GmbH traf sich in Berlin mit dem Vorstand.',
              'ru': 'Иван Петров работает в компании Ромашка в Москве.',
              'ar': 'التقى محمد علي بشركة النور في دبي.',
          }
          extractor = GLiNERExtractor(eager_load=False, threshold=0.35)
          try:
              for language, text in samples.items():
                  result = extractor.extract(text, language=language)
                  print(language, result.to_dict())
                  # Extraction quality is probabilistic; offsets are a hard
                  # contract and must hold for every span the model returns.
                  assert all(text[e.start_char:e.end_char] == e.text for e in result.entities)
                  if not result.entities:
                      print(f'::warning::{language}: multilingual preflight found no entity')
          finally:
              extractor.close()
          PYCODE

      - name: Workers AI triplet preflight (free tier, optional)
        if: vars.TRIPLET_BACKEND == 'cloudflare'
        env:
          CF_AI_MAX_CHUNKS: '2'
        run: |
          python - <<'PYCODE'
          from nlp.triplet_extractor import CloudflareTripletExtractor
          from puppetnet.config import load_settings

          settings = load_settings()
          text = (
              'Die Acme GmbH mit Sitz in München gehört der Familie Müller. '
              'Frau Müller ist Geschäftsführerin der Acme GmbH.'
          )
          with CloudflareTripletExtractor.from_settings(settings) as extractor:
              result = extractor.extract(text, language='de')
              print(extractor.describe())
              print(result.to_dict())
              assert result.neurons_used <= settings.cf_ai_daily_neurons
              if not result.triplets:
                  print('::warning::Workers AI preflight returned no usable triplet')
          PYCODE

      - name: GLiNER extraction and Neo4j ingestion
        shell: bash
        run: |
          code=0
          python packages/pipeline/ingest.py --tier all --limit 100 || code=$?
          if [ "$code" -eq 3 ]; then
            echo '::warning::Ingestion partially succeeded; inspect the report'
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - name: APOC entity resolution
        shell: bash
        run: |
          code=0
          python entity_resolution.py --json || code=$?
          if [ "$code" -eq 3 ]; then
            echo '::warning::entity resolution partially completed; inspect reports/entity_resolution_*.json'
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Graph analytics (dedupe, cycles, Cypher PUPPET_MASTER_OF)
        shell: bash
        run: |
          code=0
          python graph_analytics.py --all --json || code=$?
          if [ "$code" -eq 3 ]; then
            echo '::warning::graph analytics partially completed; inspect reports/graph_maintenance_*.json'
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Save Workers AI neuron ledger
        if: always() && vars.TRIPLET_BACKEND == 'cloudflare'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .state/cloudflare_ai_budget.json
          key: cf-ai-budget-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingestion-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 1

  keep-alive:
    # AuraDB Free pauses an instance after 72 h without a *write*. The Worker
    # cron performs that bounded write; this daily job pings with RETURN 1 (no
    # writes, no NLP dependencies) to prove the pipeline credentials work and to
    # wake an instance that is already paused. It is a separate job so a failed
    # or disabled ingestion cannot hide a dead heartbeat.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: 'false'
      KEEP_ALIVE_TIMEOUT_SECONDS: '30'
      KEEP_ALIVE_RETRIES: '2'
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require actual database credentials
        shell: bash
        run: |
          test -n "$NEO4J_URI" || { echo 'Missing NEO4J_URI'; exit 1; }
          test -n "$NEO4J_USERNAME" || { echo 'Missing NEO4J_USERNAME'; exit 1; }
          test -n "$NEO4J_PASSWORD" || { echo 'Missing NEO4J_PASSWORD'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/pipeline/pyproject.toml
      - name: Install the pipeline (no model weights, no inference API)
        run: pip install -e './packages/pipeline'
      - name: Keep the free-tier instance awake
        run: python keep_alive.py --json
