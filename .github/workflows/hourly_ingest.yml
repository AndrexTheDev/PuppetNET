# =============================================================================
#  PuppetNET — hourly harvest of time-sensitive sources
# =============================================================================
#  Runs at five past every hour and harvests only the sources whose value decays
#  within hours: the news wires, the live ADS-B feeds and the investigative-news
#  feeds (see `specs_for_tier("hourly")` in puppetnet/sources/registry.py).
#
#  Why hourly, and why only those sources:
#      * A news article is corroboration for an ownership edge while it is news;
#        a day later the same article is the same evidence, re-read. The graph's
#        `noisy_or` merge counts *new documents*, so harvesting the wires every
#        hour adds observations, while harvesting a company register every hour
#        would only re-read the same rows.
#      * Registers, leak databases and Wikidata change on the order of days, so
#        they stay in Daily Ingest. This workflow never touches them.
#
#  This workflow is the first link of the scheduled chain:
#      Hourly Ingest  →  Daily Ingest  →  Graph Maintenance
#  The three ingest workflows are deliberately *not* chained to one another:
#  linking them would make the slow tier run 24 times a day, which is exactly
#  the cost the tiers exist to avoid. Each tier keeps its own cron —
#      Hourly Ingest  5 * * * *      fast tier
#      Daily Ingest   13 4 * * *     slow tier   →  Graph Maintenance
#      Weekly Ingest  13 2 * * 0     every source, deep budgets
#  and the three share one concurrency group, so two writers never touch Neo4j
#  at the same time.
#
#  Required repository secrets (Settings → Secrets and variables → Actions):
#      NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD
#      PROXY_WORKER_URL, PROXY_AUTH_TOKEN
#  Optional:
#      WIKIDATA_USER_AGENT, ICIJ_QUERY_TERMS, RSS_FEEDS, REGISTER_FILES,
#      OPENCORPORATES_API_TOKEN, COMPANIES_HOUSE_API_KEY
#
#  Without Neo4j credentials the run still completes: `--doctor` reports the gap
#  and the pipeline falls back to a dry run, so a fork of this repo never fails
#  its first scheduled execution.
# =============================================================================

name: Hourly Ingest

on:
  schedule:
    # Five past the hour. Off the top-of-the-hour mark, when GitHub's scheduler
    # and every other project's cron fire at once — that congestion is what
    # delays scheduled runs, and a delayed hourly run is a missed news cycle.
    - cron: "5 * * * *"

  workflow_dispatch:
    inputs:
      sources:
        description: "Hourly source ids or adapter names (comma-separated). Empty = the hourly tier."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Harvest + parse but write nothing to Neo4j"
        required: false
        default: false
        type: boolean
      limit:
        description: "Max documents per source (empty = MAX_DOCUMENTS_PER_SOURCE)"
        required: false
        default: ""
        type: string
      log_level:
        description: "Log level"
        required: false
        default: "INFO"
        type: choice
        options: [DEBUG, INFO, WARNING, ERROR]
      skip_nlp:
        description: "Skip spaCy (structured sources only, much faster)"
        required: false
        default: false
        type: boolean
      fail_on_error:
        description: "Fail the workflow if any source recorded an error"
        required: false
        default: false
        type: boolean

# An ingest must never overlap another ingest: two writers racing on the same
# MERGE keys produce duplicate nodes and burn Actions minutes. The group name is
# shared with Daily and Weekly Ingest on purpose — see the header.
concurrency:
  group: puppetnet-ingest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  # spaCy warns loudly about CUDA on CPU runners; silence it.
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"

jobs:
  ingest:
    name: Hourly harvest → NLP → Neo4j
    runs-on: ubuntu-latest
    # Harvest budget is MAX_RUNTIME_SECONDS (15 min) + install/model overhead.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      # ---------------------------------------------------------------------
      # NLP model. The small model is installed first here, the opposite order
      # from Daily Ingest: an hourly run has a 15-minute budget and the small
      # model installs in seconds, so a slow CDN must not eat the harvest window.
      # ingest.py falls back to a blank spaCy pipeline + gazetteer if nothing
      # loads, and the engine prices those edges at the co-occurrence rate.
      # ---------------------------------------------------------------------
      - name: Download spaCy model
        id: spacy_model
        continue-on-error: true
        run: |
          set -o pipefail
          models="en_core_web_sm en_core_web_md en_core_web_lg"
          installed=""
          for model in $models; do
            echo "::group::trying $model"
            if python -m spacy download "$model" 2>&1; then
              if python -c "import spacy,sys; spacy.load('$model'); print('$model loads cleanly')" 2>&1; then
                installed="$model"
                echo "::endgroup::"
                break
              fi
            fi
            echo "::warning::$model could not be installed or loaded"
            echo "::endgroup::"
          done

          if [ -n "$installed" ]; then
            echo "model=$installed" >> "$GITHUB_OUTPUT"
            echo "Using spaCy model: $installed"
          else
            echo "model=" >> "$GITHUB_OUTPUT"
            echo "::warning title=NLP degraded::No spaCy model installed — using the lexical fallback pipeline."
          fi
        env:
          SPACY_MODELS: "en_core_web_sm en_core_web_md en_core_web_lg"

      # ---------------------------------------------------------------------
      # Fail fast on misconfiguration, but never on a missing model or an
      # absent Neo4j credential: --doctor distinguishes fatal from degradable.
      # ---------------------------------------------------------------------
      - name: Preflight checks (ingest.py --doctor)
        run: |
          python ingest.py --doctor || doctor_status=$?
          case "${doctor_status:-0}" in
            0) echo "preflight: OK" ;;
            1) echo "::error title=Configuration invalid::Fix the secrets listed above and re-run."
               exit 1 ;;
            *) echo "::warning title=Preflight degraded::Continuing; the pipeline will run in reduced mode (exit ${doctor_status})." ;;
          esac
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          PROXY_WORKER_URL: ${{ secrets.PROXY_WORKER_URL }}
          PROXY_AUTH_TOKEN: ${{ secrets.PROXY_AUTH_TOKEN }}

      # Document hashes seen in recent runs, so an unchanged feed costs nothing.
      # Neo4j is the authoritative dedupe source; this is a warm cache for dry
      # runs and for the window before the graph write completes. restore-keys
      # picks up the newest state left by any previous tier, which is what makes
      # the hourly heat map shared rather than per-workflow.
      - name: Restore harvest state
        uses: actions/cache@v6
        with:
          path: .state
          key: puppetnet-state-${{ github.run_id }}
          restore-keys: |
            puppetnet-state-

      - name: Resolve ingest arguments
        id: args
        env:
          # Inputs reach the shell through `env`, never by interpolation into
          # the script body — a dispatch input containing `$(…)` must not be
          # able to execute in the runner.
          IN_SOURCES: ${{ inputs.sources }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_LOG_LEVEL: ${{ inputs.log_level }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_SKIP_NLP: ${{ inputs.skip_nlp }}
          IN_FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
        run: |
          # The tier is not an input: this workflow *is* the hourly tier. A
          # manual dispatch can narrow it with --sources, but it can never widen
          # it into the daily or weekly sources.
          args="--tier hourly"
          if [ -n "$IN_SOURCES" ]; then
            case "$IN_SOURCES" in
              *[\ \;\|\&\$\`\']* )
                echo "::error title=Invalid --sources::Use comma-separated source ids or adapter names only."
                exit 1 ;;
            esac
            args="$args --sources $IN_SOURCES"
          fi
          case "$IN_LIMIT" in
            "" ) ;;
            *[!0-9]* ) echo "::error title=Invalid --limit::$IN_LIMIT is not a positive integer."; exit 1 ;;
            * ) args="$args --limit $IN_LIMIT" ;;
          esac
          case "$IN_LOG_LEVEL" in
            "" ) ;;
            DEBUG|INFO|WARNING|ERROR ) args="$args --log-level $IN_LOG_LEVEL" ;;
            * ) echo "::error title=Invalid --log-level::$IN_LOG_LEVEL"; exit 1 ;;
          esac

          # workflow_dispatch booleans arrive as the strings "true"/"false";
          # on a scheduled run every input is empty.
          [ "$IN_DRY_RUN" = "true" ]       && args="$args --dry-run"
          [ "$IN_SKIP_NLP" = "true" ]      && args="$args --skip-nlp"
          [ "$IN_FAIL_ON_ERROR" = "true" ] && args="$args --fail-on-error"

          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "resolved: ingest.py $args"

      - name: Run hourly ingest
        id: ingest
        env:
          INGEST_ARGS: ${{ steps.args.outputs.args }}
          # --- Neo4j AuraDB -------------------------------------------------
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
          # --- Cloudflare Worker edge relay ---------------------------------
          PROXY_WORKER_URL: ${{ secrets.PROXY_WORKER_URL }}
          PROXY_AUTH_TOKEN: ${{ secrets.PROXY_AUTH_TOKEN }}
          PROXY_WORKER_ENABLED: "true"
          PROXY_QUEUE_ON_LIMIT: "true"
          DIRECT_FALLBACK_ENABLED: "true"
          # --- Harvest limits -----------------------------------------------
          # Sized for a 15-minute window: the hourly tier is feeds, and a feed
          # that publishes 40 items since the last run has already been read.
          MAX_DOCUMENTS_PER_SOURCE: "40"
          MAX_DOCUMENTS_TOTAL: "400"
          MAX_RUNTIME_SECONDS: "900"
          # One request every 2.5 s with a burst of 3 — 24 runs a day against the
          # same feeds must stay firmly inside polite-crawling territory.
          TOKEN_BUCKET_RATE_PER_SEC: "0.4"
          TOKEN_BUCKET_BURST: "3"
          # --- Source credentials -------------------------------------------
          OPENCORPORATES_API_TOKEN: ${{ secrets.OPENCORPORATES_API_TOKEN }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          WIKIDATA_USER_AGENT: ${{ secrets.WIKIDATA_USER_AGENT }}
          ICIJ_QUERY_TERMS: ${{ secrets.ICIJ_QUERY_TERMS }}
          ICIJ_DATASET_URLS: ${{ secrets.ICIJ_DATASET_URLS }}
          REGISTER_FILES: ${{ secrets.REGISTER_FILES }}
          RSS_FEEDS: ${{ secrets.RSS_FEEDS }}
          # --- Run metadata --------------------------------------------------
          LOG_JSON: "true"
          SOURCES_FILE: "config/sources.yaml"
          ONLY_NEW_DOCUMENTS: "true"
          # Short window: anything older than a week that the hourly tier has not
          # already seen is the daily tier's business, not a news cycle's.
          DEDUPE_WINDOW_DAYS: "7"
        run: |
          # The runner uses `bash -e`, so capture the status explicitly and let
          # the reporting steps run before deciding whether the job failed.
          set +e
          # shellcheck disable=SC2086  # INGEST_ARGS is intentionally word-split
          python ingest.py $INGEST_ARGS --report-dir reports 2>&1 | tee ingest.log
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "ingest.py exited with $status"
          exit 0

      # ---------------------------------------------------------------------
      # Artefacts & reporting — these must run even when the ingest fails.
      # ---------------------------------------------------------------------
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hourly-ingest-report-${{ github.run_id }}
          path: |
            reports/
            ingest.log
            .state/
          if-no-files-found: warn
          retention-days: 7

      - name: Annotate failures
        if: always()
        env:
          INGEST_EXIT: ${{ steps.ingest.outputs.exit_code }}
        run: |
          exit_code="$INGEST_EXIT"
          case "$exit_code" in
            0) echo "Run completed successfully." ;;
            1) echo "::error title=Configuration error::Secrets or config/sources.yaml are invalid (exit 1)." ;;
            2) echo "::error title=Runtime failure::The pipeline aborted; see ingest.log (exit 2)." ;;
            3) echo "::warning title=Partial run::At least one source failed but the graph was written (exit 3)." ;;
            "") echo "::warning title=Unknown status::The ingest step did not report an exit code." ;;
            *) echo "::error title=Unexpected exit::ingest.py exited with $exit_code." ;;
          esac

      # Exit 3 (partial) is deliberately non-fatal for the schedule: a single
      # flaky feed should not mark the whole run failed — with 24 runs a day,
      # failing on one dead RSS endpoint would paint the whole day red. Escalate
      # by enabling the fail_on_error input on a manual dispatch.
      - name: Fail on hard errors
        if: always()
        env:
          INGEST_EXIT: ${{ steps.ingest.outputs.exit_code }}
        run: |
          exit_code="$INGEST_EXIT"
          if [ "$exit_code" = "1" ] || [ "$exit_code" = "2" ]; then
            exit 1
          fi
