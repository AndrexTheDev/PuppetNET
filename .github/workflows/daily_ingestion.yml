name: Bounded daily ingestion and static publication
on:
  schedule:
    # Conservative profile: two bounded runs per UTC day, twelve hours apart.
    # GitHub may delay or drop scheduled workflows under high load; the
    # Git-persisted quota ledger stays the authority.
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
    # Public-repository profile ONLY (vars.PIPELINE_PROFILE == 'public' AND the
    # profile job verified via the API that the repository is public, so
    # standard GitHub-hosted runner minutes are free): six extra slots, i.e.
    # about one run every three hours, at :30 because :00 is GitHub's busiest
    # minute. Without a verified public repository this slot is skipped.
    - cron: '30 0,6,9,12,18,21 * * *'
  repository_dispatch:
    types: [puppetnet-refresh]
  workflow_dispatch:
  # TEMPORARY (QA dry run, 2026-10-20): branch pushes run the verify-connections
  # job below (the production publish job stays gated to main + ENABLE_DAILY_STATIC
  # and never runs from branch pushes). Remove this trigger together with the QA
  # job once the dry run is green.
  push:
    branches-ignore: [main]

permissions:
  contents: read
concurrency:
  # Serialize with the legacy ingestion job too: no overlapping graph writes.
  group: puppetnet-python-ingestion
  cancel-in-progress: false

jobs:
  profile:
    # Decides the run profile BEFORE any quota is reserved. Runs only when an
    # operator opted in; otherwise publish keeps the conservative defaults.
    # github.event.repository.private is not used: schedule payloads may lack
    # it and an empty value would read as "public" (null == false).
    if: vars.ENABLE_DAILY_STATIC == 'true' && github.ref == 'refs/heads/main' && vars.PIPELINE_PROFILE == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      public: ${{ steps.detect.outputs.public }}
    steps:
      - name: Verify repository visibility through the API (fail closed)
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private' 2>/dev/null || echo unknown)"
          if [ "$private" = "false" ]; then
            echo 'public=true' >> "$GITHUB_OUTPUT"
            echo '::notice::Public repository verified: standard GitHub-hosted runner minutes are free; public profile active.'
          else
            echo 'public=false' >> "$GITHUB_OUTPUT"
            echo "::warning::PIPELINE_PROFILE=public but repository visibility is '$private'; conservative profile stays active."
          fi

  publish:
    needs: profile
    # !cancelled(): publish also runs when the profile job was skipped
    # (conservative default) or failed (empty output = conservative). The
    # public-only cron slot never runs without a verified public repository.
    if: >-
      !cancelled() && vars.ENABLE_DAILY_STATIC == 'true' && github.ref == 'refs/heads/main' &&
      (github.event.schedule != '30 0,6,9,12,18,21 * * *' || needs.profile.outputs.public == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.profile.outputs.public == 'true' && 20 || 5 }}
    permissions:
      contents: write
    env:
      # Runtime data publication targets production; development stays on its PR branch.
      PUBLISH_BRANCH: main
      NLP_BACKEND: token_saver
      SPACY_MODELS: de_core_news_sm
      INGEST_QUERY: ${{ github.event.client_payload.query || '' }}
      ENABLED_SOURCES: news_world
      RSS_FEEDS: ${{ vars.DAILY_RSS_FEEDS }}
      VERIFIED_RSS_FEEDS: ${{ vars.VERIFIED_RSS_FEEDS }}
      # Profile-dependent budgets: public = verified public repository (free
      # standard runner minutes), default = conservative pre-profile values.
      DAILY_SCHEDULED_SLOTS: ${{ needs.profile.outputs.public == 'true' && '8' || '2' }}
      DAILY_MANUAL_SLOTS: ${{ needs.profile.outputs.public == 'true' && '3' || '1' }}
      MAX_DOCUMENTS_TOTAL: ${{ needs.profile.outputs.public == 'true' && '30' || '10' }}
      MAX_DOCUMENTS_PER_SOURCE: ${{ needs.profile.outputs.public == 'true' && '30' || '10' }}
      MAX_RUNTIME_SECONDS: ${{ needs.profile.outputs.public == 'true' && '600' || '90' }}
      INGEST_TIMEOUT_SECONDS: ${{ needs.profile.outputs.public == 'true' && '660' || '105' }}
      EXPORT_TIMEOUT_SECONDS: ${{ needs.profile.outputs.public == 'true' && '120' || '45' }}
      ANALYTICS_ENABLED: 'false'
      TRIPLET_BACKEND: 'off'
      DRY_RUN: 'false'
      STATE_DIR: .state
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
      ENABLE_GEMINI_FALLBACK: ${{ vars.ENABLE_GEMINI_FALLBACK || 'false' }}
      GEMINI_BUDGET_FILE: .pipeline-state/gemini-budget.json
      # Free-tier broker (docs/gemini-strategy.md): one budgeted request per
      # document instead of per-sentence pair calls. Off unless both repository
      # variables opt in; limits come from AI Studio via GEMINI_MODEL_LIMITS.
      GEMINI_MODE: ${{ vars.GEMINI_MODE || 'pair' }}
      ENABLE_GEMINI_BROKER: ${{ vars.ENABLE_GEMINI_BROKER || 'false' }}
      GEMINI_BROKER_LEDGER: .pipeline-state/gemini-broker.json
      GEMINI_MODEL_LIMITS: ${{ vars.GEMINI_MODEL_LIMITS }}
      GEMINI_TASK_CAPS: ${{ vars.GEMINI_TASK_CAPS }}
      GEMINI_EXTRACT_MODELS: ${{ vars.GEMINI_EXTRACT_MODELS }}
      GEMINI_SAFETY_FACTOR: ${{ vars.GEMINI_SAFETY_FACTOR || '0.8' }}
      GEMINI_RUNS_PER_DAY: ${{ needs.profile.outputs.public == 'true' && '8' || '2' }}
      GEMINI_RUN_SECONDS: ${{ needs.profile.outputs.public == 'true' && '420' || '60' }}
      GEMINI_AUTO_RELEASE: ${{ vars.GEMINI_AUTO_RELEASE || 'false' }}
      PROXY_WORKER_URL: ${{ secrets.PROXY_WORKER_URL }}
      PROXY_AUTH_TOKEN: ${{ secrets.PROXY_AUTH_TOKEN }}
    steps:
      - name: Require publication token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: test -n "$GH_PAT" # never print credential values
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/pipeline/pyproject.toml
      - name: Validate prerequisites
        run: |
          test -n "$NEO4J_URI" && test -n "$NEO4J_USER" && test -n "$NEO4J_PASSWORD"
          test -n "$RSS_FEEDS" # configure German-language sources for de_core_news_sm
          python - <<'PYCODE'
          import os
          query = os.environ.get('INGEST_QUERY', '')
          if len(query) > 120 or any(ord(char) < 32 for char in query):
              raise SystemExit('query must be at most 120 printable characters')
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Reserve one bounded daily run slot BEFORE work
        id: quota
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python packages/pipeline/src/export_static_slices.py --reserve-run "$EVENT_NAME"
          if ! git diff --quiet -- .pipeline-state/daily-budget.json || test -n "$(git ls-files --others --exclude-standard .pipeline-state/daily-budget.json)"; then
            git add -- .pipeline-state/daily-budget.json
            git commit -m "chore: reserve daily ingestion budget [skip ci]"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi
      - name: Install small local NLP backend
        if: steps.quota.outputs.allowed == 'true'
        run: |
          pip install -e packages/pipeline
          pip install 'https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl'
      - name: Restore document dedupe state (optimization, not quota authority)
        if: steps.quota.outputs.allowed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .state/content_hashes.json
          key: daily-dedupe-${{ github.run_id }}
          restore-keys: daily-dedupe-
      - name: Ingest a bounded source slice
        if: steps.quota.outputs.allowed == 'true'
        shell: bash
        run: |
          set +e
          timeout "${INGEST_TIMEOUT_SECONDS}s" python packages/pipeline/ingest.py --sources news_world --limit "$MAX_DOCUMENTS_TOTAL"
          code=$?
          set -e
          # Partial success is reported; hard/configuration errors abort publication.
          if [ "$code" -eq 3 ]; then
            echo '::warning::Partial ingestion; only policy-released, non-private data will be exported.'
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - name: Export auto-released public graph and entity slices
        if: steps.quota.outputs.allowed == 'true'
        run: timeout "${EXPORT_TIMEOUT_SECONDS}s" python packages/pipeline/src/export_static_slices.py --neo4j --allow-empty
      - name: Persist cloud reservations, including failed requests
        if: always() && steps.quota.outputs.allowed == 'true'
        run: |
          # The broker reserves every request on disk BEFORE sending it, so even
          # a timeout-killed run leaves an accurate (conservative) ledger here.
          for ledger in .pipeline-state/gemini-budget.json .pipeline-state/gemini-broker.json; do
            if test -f "$ledger"; then git add -- "$ledger"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist bounded NLP reservations [skip ci]"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi
      - name: Publish changed static data only
        if: success() && steps.quota.outputs.allowed == 'true'
        run: |
          git add -- apps/web/public/data/graph_latest.json apps/web/public/data/static-manifest.json
          if test -d apps/web/public/data/entities; then
            git add -A -- apps/web/public/data/entities/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: publish auto-released static graph"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.quota.outputs.allowed == 'true'
        with:
          path: .state/content_hashes.json
          key: daily-dedupe-${{ github.run_id }}

  # TEMPORARY QA job (pre-cron dry run, 2026-10-20). Runs only on manual
  # workflow_dispatch, never on schedule/repository_dispatch, never writes to
  # main and never touches the production quota ledger: it probes Neo4j,
  # spaCy, the Gemini API and the export path with packages/pipeline/tests/
  # test_api_connections.py, then pushes a JSON report to the dispatched
  # branch. Remove together with the test script after a fully green run.
  verify-connections:
    name: QA verify connections (temporary)
    # workflow_dispatch (manual dry run) or the temporary branches-ignore push
    # trigger above. Never runs on schedule/repository_dispatch, never on main.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: neo4j
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/pipeline/pyproject.toml
      - name: Install pipeline dependencies and de_core_news_sm
        run: |
          pip install -e packages/pipeline
          pip install 'https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl'
      - name: QA 0 - secrets presence (values never printed)
        if: ${{ !cancelled() }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python packages/pipeline/tests/test_api_connections.py --stage secrets --json-out "$RUNNER_TEMP/qa-secrets.json"
      - name: QA 1 - Neo4j live query (RETURN 1 AS test)
        if: ${{ !cancelled() }}
        run: python packages/pipeline/tests/test_api_connections.py --stage neo4j --json-out "$RUNNER_TEMP/qa-neo4j.json"
      - name: QA 2 - spaCy de_core_news_sm entity extraction
        if: ${{ !cancelled() }}
        run: python packages/pipeline/tests/test_api_connections.py --stage spacy --json-out "$RUNNER_TEMP/qa-spacy.json"
      - name: QA 3 - Gemini API live classification (<=50 output tokens)
        if: ${{ !cancelled() }}
        run: python packages/pipeline/tests/test_api_connections.py --stage gemini --json-out "$RUNNER_TEMP/qa-gemini.json"
      - name: QA 4 - graph_latest.json export smoke (offline)
        if: ${{ !cancelled() }}
        run: python packages/pipeline/tests/test_api_connections.py --stage export --json-out "$RUNNER_TEMP/qa-export.json"
      - name: Publish QA report to the dispatched branch
        if: ${{ always() }}
        run: |
          python - <<'PYCODE'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          stages = {}
          for name in ("secrets", "neo4j", "spacy", "gemini", "export"):
              report = runner_temp / f"qa-{name}.json"
              if report.exists():
                  stages.update(json.loads(report.read_text(encoding="utf-8")).get("stages", {}))
              else:
                  stages[name] = {"status": "fail", "detail": "stage did not run (setup failed or step skipped)"}
          verdict = {name: {"ok": "OK", "warn": "WARN", "fail": "FAIL"}[result["status"]] for name, result in stages.items()}
          keys = {"secrets": "status_secrets", "neo4j": "status_neo4j", "spacy": "status_spacy",
                  "gemini": "status_gemini_api", "export": "status_export"}
          summary = {keys[name]: verdict[name] for name in stages}
          merged = {"generated_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
                    "github_run_id": os.environ.get("GITHUB_RUN_ID"),
                    "github_ref": os.environ.get("GITHUB_REF_NAME"),
                    "workflow": "daily_ingestion.yml / verify-connections (temporary QA dry run)",
                    "stages": stages, "summary": summary}
          Path("qa-report-api-connections.json").write_text(
              json.dumps(merged, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as handle:
                  handle.write("## QA connection probe (temporary dry run)\n\n")
                  for name, result in stages.items():
                      detail = result.get("detail", "")
                      handle.write(f"- **{keys[name]}**: {verdict[name]}" + (f" — {detail}\n" if detail else "\n"))
          print("QA SUMMARY:", json.dumps(summary, sort_keys=True))
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- qa-report-api-connections.json
          git commit -m "qa: api connection dry-run report (run $GITHUB_RUN_ID) [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
