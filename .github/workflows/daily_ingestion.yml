name: Bounded daily ingestion and static publication
on:
  schedule:
    - cron: '0 3 * * *'
  repository_dispatch:
    types: [puppetnet-refresh]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  # Serialize with the legacy ingestion job too: no overlapping graph writes.
  group: puppetnet-python-ingestion
  cancel-in-progress: false

jobs:
  publish:
    if: vars.ENABLE_DAILY_STATIC == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      # Runtime data publication targets production; development stays on its PR branch.
      PUBLISH_BRANCH: main
      NLP_BACKEND: token_saver
      SPACY_MODELS: de_core_news_sm
      INGEST_QUERY: ${{ github.event.client_payload.query || '' }}
      ENABLED_SOURCES: news_world
      RSS_FEEDS: ${{ vars.DAILY_RSS_FEEDS }}
      VERIFIED_RSS_FEEDS: ${{ vars.VERIFIED_RSS_FEEDS }}
      MAX_DOCUMENTS_TOTAL: '10'
      MAX_DOCUMENTS_PER_SOURCE: '10'
      MAX_RUNTIME_SECONDS: '90'
      ANALYTICS_ENABLED: 'false'
      TRIPLET_BACKEND: 'off'
      DRY_RUN: 'false'
      STATE_DIR: .state
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-1.5-flash' }}
      ENABLE_GEMINI_FALLBACK: ${{ vars.ENABLE_GEMINI_FALLBACK || 'false' }}
      GEMINI_BUDGET_FILE: .pipeline-state/gemini-budget.json
      PROXY_WORKER_URL: ${{ secrets.PROXY_WORKER_URL }}
      PROXY_AUTH_TOKEN: ${{ secrets.PROXY_AUTH_TOKEN }}
    steps:
      - name: Require publication token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: test -n "$GH_PAT" # never print credential values
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/pipeline/pyproject.toml
      - name: Validate prerequisites
        run: |
          test -n "$NEO4J_URI" && test -n "$NEO4J_USER" && test -n "$NEO4J_PASSWORD"
          test -n "$RSS_FEEDS" # configure German-language sources for de_core_news_sm
          python - <<'PYCODE'
          import os
          query = os.environ.get('INGEST_QUERY', '')
          if len(query) > 120 or any(ord(char) < 32 for char in query):
              raise SystemExit('query must be at most 120 printable characters')
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Reserve one of at most two daily runs BEFORE work
        id: quota
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python packages/pipeline/src/export_static_slices.py --reserve-run "$EVENT_NAME"
          if ! git diff --quiet -- .pipeline-state/daily-budget.json || test -n "$(git ls-files --others --exclude-standard .pipeline-state/daily-budget.json)"; then
            git add -- .pipeline-state/daily-budget.json
            git commit -m "chore: reserve daily ingestion budget [skip ci]"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi
      - name: Install small local NLP backend
        if: steps.quota.outputs.allowed == 'true'
        run: |
          pip install -e packages/pipeline
          pip install 'https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl'
      - name: Restore document dedupe state (optimization, not quota authority)
        if: steps.quota.outputs.allowed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .state/content_hashes.json
          key: daily-dedupe-${{ github.run_id }}
          restore-keys: daily-dedupe-
      - name: Ingest a bounded source slice
        if: steps.quota.outputs.allowed == 'true'
        shell: bash
        run: |
          set +e
          timeout 105s python packages/pipeline/ingest.py --sources news_world --limit 10
          code=$?
          set -e
          # Partial success is reported; hard/configuration errors abort publication.
          if [ "$code" -eq 3 ]; then
            echo '::warning::Partial ingestion; only policy-released, non-private data will be exported.'
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - name: Export auto-released public graph and entity slices
        if: steps.quota.outputs.allowed == 'true'
        run: timeout 45s python packages/pipeline/src/export_static_slices.py --neo4j --allow-empty
      - name: Persist cloud reservations, including failed requests
        if: always() && steps.quota.outputs.allowed == 'true'
        run: |
          if test -f .pipeline-state/gemini-budget.json; then
            git add -- .pipeline-state/gemini-budget.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist bounded NLP reservations [skip ci]"
              git push origin "HEAD:$PUBLISH_BRANCH"
            fi
          fi
      - name: Publish changed static data only
        if: success() && steps.quota.outputs.allowed == 'true'
        run: |
          git add -- apps/web/public/data/graph_latest.json apps/web/public/data/static-manifest.json
          if test -d apps/web/public/data/entities; then
            git add -A -- apps/web/public/data/entities/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: publish auto-released static graph"
            git push origin "HEAD:$PUBLISH_BRANCH"
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.quota.outputs.allowed == 'true'
        with:
          path: .state/content_hashes.json
          key: daily-dedupe-${{ github.run_id }}
