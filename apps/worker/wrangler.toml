name = "puppetnet-edge-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# No KV, Durable Objects, queues, database credentials or scheduled handlers.
# Existing deployed cron triggers must also be removed in Cloudflare on migration.
[limits]
cpu_ms = 10

[vars]
PAGES_ORIGIN = "https://puppetnet-web.pages.dev"
ALLOWED_ORIGINS = "https://puppetnet-web.pages.dev"
GITHUB_OWNER = "AndrexTheDev"
GITHUB_REPO = "PuppetNET"

# Secrets (never commit values):
#   GH_PAT: fine-grained GitHub token authorized for repository_dispatch
#   SEARCH_AUTH_TOKEN: independent random operator token, at least 32 characters
# The browser receives neither GitHub credentials nor database credentials.
# Deploy from this workspace: npm run deploy -w @puppetnet/worker
