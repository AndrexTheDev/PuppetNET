# =============================================================================
#  PuppetNET Edge Fetch Relay — Cloudflare Worker configuration
# =============================================================================
#
#  Deploy:
#     npm i -g wrangler            # or: npx wrangler@latest
#     wrangler login
#     wrangler kv namespace create RATE_LIMIT_KV
#     wrangler kv namespace create RESULT_KV
#     wrangler queues create puppetnet-fetch-queue
#     -> paste the ids/preview ids below, then:
#     wrangler secret put PROXY_AUTH_TOKEN
#     wrangler secret put OPENCORPORATES_API_TOKEN     # optional, see below
#     wrangler secret put ADSBEXCHANGE_API_KEY         # optional (RapidAPI)
#     wrangler secret put COMPANIES_HOUSE_API_KEY      # optional
#     wrangler secret put NEO4J_URI                    # for the /graph/* API
#     wrangler secret put NEO4J_PASSWORD
#     wrangler secret put GRAPH_API_TOKEN              # console token (optional)
#     wrangler deploy
#
#  `wrangler dev --local` works without any binding: the relay degrades to a
#  stateless forwarder with per-isolate rate limiting.
# =============================================================================

name = "puppetnet-edge-relay"
main = "worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
account_id = ""            # set via `wrangler login` or CI secret CF_ACCOUNT_ID

[observability]
enabled = true
head_sampling_rate = 1

# Daily janitorial cron: prune idle in-isolate buckets, reset global counter.
[triggers]
crons = ["30 4 * * *"]

# -----------------------------------------------------------------------------
# Plain (non-secret) configuration. Every value is optional; worker.js has sane
# defaults. These are the politeness knobs the OSINT harvester cares about.
# -----------------------------------------------------------------------------
[vars]
# Per-host token bucket defaults (refill rate + burst capacity).
HOST_RATE_PER_SEC = "0.5"          # ~1 request every 2s per target host
HOST_BURST = "4"
# Floors the Worker will not go below, whatever a client requests.
MIN_HOST_RATE_PER_SEC = "0.02"
MAX_HOST_BURST = "20"
# Worker-wide requests/minute safety valve (protects free-tier CPU + KV quotas).
GLOBAL_RPM = "900"
# How often an in-isolate bucket reconciles with KV (ms).
KV_SYNC_INTERVAL_MS = "20000"

# Networking
DEFAULT_TIMEOUT_MS = "25000"
MAX_TIMEOUT_MS = "90000"
DEFAULT_MAX_ATTEMPTS = "3"
MAX_MAX_ATTEMPTS = "5"

# Payload caps
MAX_RESPONSE_BYTES = "8388608"     # 8 MiB
MAX_CONTROL_BODY_BYTES = "262144"  # 256 KiB control envelope

# Caching / robots
DEFAULT_CACHE_TTL_SECONDS = "0"    # 0 = never cache unless the caller asks
MAX_CACHE_TTL_SECONDS = "86400"
ROBOTS_TTL_SECONDS = "21600"
TASK_RESULT_TTL_SECONDS = "3600"

# Queue deferral
MAX_QUEUE_DELAY_SECONDS = "300"

# -----------------------------------------------------------------------------
# Host profiles — the per-API politeness and credential policy in worker.js
# -----------------------------------------------------------------------------
#
# `HOST_PROFILES` in worker.js pins a rate ceiling, an API-mode User-Agent, a
# timeout and a cache TTL per upstream host (Wikidata SPARQL, OpenCorporates,
# ADS-B Exchange, RapidAPI, FAA, Companies House, ICIJ). A caller may ask for a
# *slower* rate, never a faster one, and profile timeouts are themselves capped
# by MAX_TIMEOUT_MS above (raise it to 180000 if you want the FAA dump relayed
# rather than streamed directly by the harvester).
#
# Identifying the tool is a requirement of Wikidata's API policy, not a courtesy:
# set a contactable agent so an operator can reach you before blocking you.
WIKIDATA_USER_AGENT = "PuppetNET/1.6 (OSINT research harvester; github.com/AndrexTheDev/PuppetNET) edge-relay"

# Credentials are Worker *secrets*, never [vars], so they cannot be committed or
# read back over /health (which reports only whether one is configured):
#   OPENCORPORATES_API_TOKEN  -> appended as ?api_token= and stripped from every
#                                URL the relay reports or caches
#   ADSBEXCHANGE_API_KEY      -> x-rapidapi-key (+ x-rapidapi-host) for RapidAPI
#   COMPANIES_HOUSE_API_KEY   -> HTTP Basic for api.company-information.service.gov.uk
# They are injected on the outgoing request only, so a deferred Queue task, a KV
# cache key and a stored task result never contain them.

# -----------------------------------------------------------------------------
# Graph read API (/graph/*) — serves web/, the browser console
# -----------------------------------------------------------------------------
#
# A static SPA on Cloudflare Pages cannot hold database credentials: whatever is
# shipped to a browser is public. These endpoints let the Worker hold the Neo4j
# secrets and hand the console back exactly the graph it is allowed to see.
# Every statement is read-only and parameterised, and no endpoint accepts Cypher.
GRAPH_API_ENABLED = "true"
GRAPH_PUBLIC_READ = "false"        # true = no token needed (read-only, still rate-limited)
NEO4J_DATABASE = "neo4j"           # AuraDB virtual database name
# Politeness toward the database: a token bucket keyed graph:neo4j, separate from
# the per-host buckets used by the harvester.
GRAPH_RATE_PER_SEC = "4"
GRAPH_BURST = "8"
GRAPH_TIMEOUT_MS = "20000"
# Result caching in RESULT_KV. A dashboard refresh should cost one query, not
# six; 60s is short enough that a re-ingest becomes visible quickly.
GRAPH_CACHE_TTL_SECONDS = "60"
# Hard ceilings on what a browser may ask for (free-tier protection).
GRAPH_MAX_NODES = "1200"
GRAPH_MAX_DEPTH = "4"
GRAPH_MAX_HOPS = "12"
GRAPH_MAX_RESPONSE_BYTES = "6291456"   # 6 MiB
GRAPH_PATH_ALTERNATIVES = "true"
# Capacity ceilings reported to the console's status bar; must match the values
# graph_analytics.py uses so the two agree on when pruning should escalate.
AURA_NODE_CAP = "200000"
AURA_EDGE_CAP = "400000"

# The database credentials are *secrets*, never [vars]:
#   NEO4J_URI        -> AuraDB bolt URI (neo4j+s://<id>.databases.neo4j.io:7687);
#                       the Worker rewrites it to the https transactional endpoint
#                       at the same host. NEO4J_HTTP_URI overrides for a
#                       self-hosted database behind a proxy.
#   NEO4J_USERNAME   -> optional, defaults to "neo4j"
#   NEO4J_PASSWORD   -> required for /graph/* to report configured
#   GRAPH_API_TOKEN  -> bearer token for the console. Distinct from
#                       PROXY_AUTH_TOKEN on purpose: rotating the dashboard token
#                       must not touch the ingest pipeline. Comma-separate several
#                       (or use GRAPH_API_TOKENS). If neither is set, the graph API
#                       falls back to accepting PROXY_AUTH_TOKEN so a
#                       single-secret deployment still works.
# A URI can carry credentials, so /graph/health reports only the host, and error
# messages strip any userinfo before they are logged or returned.

# Security
ENFORCE_HTTPS = "true"             # refuse plaintext http:// targets
ALLOW_PRIVATE_NETWORKS = "false"   # SSRF guard: block localhost / RFC1918
BLOCKED_HOST_SUFFIXES = ""         # e.g. "facebook.com,linkedin.com"
# CORS for the PuppetNET web front-end. "*" is fine for a read-only console and
# required while it is served from a Pages preview URL; pin it to your Pages
# domain in production (see docs/web-console.md#hardening).
ALLOWED_ORIGINS = "*"

# -----------------------------------------------------------------------------
# Bindings — fill in the ids after `wrangler kv namespace create ...`
# -----------------------------------------------------------------------------
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_RATE_LIMIT_KV_ID"
preview_id = "REPLACE_WITH_RATE_LIMIT_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "RESULT_KV"
id = "REPLACE_WITH_RESULT_KV_ID"
preview_id = "REPLACE_WITH_RESULT_KV_PREVIEW_ID"

[[queues.producers]]
queue = "puppetnet-fetch-queue"
binding = "FETCH_QUEUE"

[[queues.consumers]]
queue = "puppetnet-fetch-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
retry_delay = "fixed"

# Free-tier friendly execution limits
[limits]
cpu_ms = 30000

# -----------------------------------------------------------------------------
# Production environment overrides (stricter politeness for hostile origins)
# -----------------------------------------------------------------------------
[env.production.vars]
GLOBAL_RPM = "600"
HOST_RATE_PER_SEC = "0.34"
HOST_BURST = "3"

[env.production.triggers]
crons = ["30 4 * * *"]
